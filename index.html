<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>동영상 재생</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
body{display:grid;place-items:center}
#cover{position:fixed;inset:0;background:#000;display:grid;place-items:center;cursor:pointer;z-index:2}
#cover button{background:#171717;color:#fff;border:1px solid #555;border-radius:999px;padding:18px 30px;font-size:18px;cursor:pointer}
#cover button:hover{background:#292929}
video{width:100%;height:100%;object-fit:contain;background:#000}
</style>
</head>
<body>
<div id="cover"><button type="button" id="play">▶ 재생하기</button></div>
<video id="movie" src="214130.mp4" playsinline controls loop preload="metadata"></video>
<script>
const cover=document.getElementById('cover');
const movie=document.getElementById('movie');
document.getElementById('play').addEventListener('click', async()=>{
  cover.remove();
  movie.volume=1;
  try { await movie.play(); }
  catch(e) { cover.style.display='grid'; }
});
</script>
</body>
</html>
