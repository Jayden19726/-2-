<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제이든에게 츄팝츄스 받기 💗</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #873b63;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.8) 0 3px, transparent 4px),
        linear-gradient(135deg, #ffd6e8, #ffc0dc 48%, #ffe5f0);
      background-size: 90px 90px, 120px 120px, auto;
    }
    .card {
      width: min(100%, 460px);
      padding: 34px 24px;
      text-align: center;
      border: 2px solid rgba(255,255,255,.85);
      border-radius: 30px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 18px 55px rgba(191, 78, 132, .20);
      backdrop-filter: blur(10px);
    }
    .hearts { font-size: 28px; letter-spacing: 8px; margin-bottom: 12px; }
    h1 { margin: 0 0 12px; font-size: clamp(25px, 7vw, 34px); color: #d94f91; }
    p { margin: 0 0 25px; color: #9b5b7a; font-size: 15px; }
    .gift {
      font-size: 72px;
      line-height: 1.2;
      margin: 8px 0 22px;
      filter: drop-shadow(0 7px 7px rgba(199, 76, 135, .18));
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 999px;
      padding: 17px 20px;
      color: white;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      background: linear-gradient(135deg, #ff79b7, #ed4e9b);
      box-shadow: 0 8px 0 #cf3f83, 0 14px 24px rgba(207, 63, 131, .25);
      transition: transform .15s, box-shadow .15s;
    }
    button:active { transform: translateY(5px); box-shadow: 0 3px 0 #cf3f83; }
    .hint { margin-top: 18px; font-size: 12px; color: #b47b97; }
    #videoWrap { display: none; margin-top: 24px; }
    #videoWrap video {
      display: block;
      width: 100%;
      max-height: 65vh;
      border-radius: 18px;
      background: #000;
      box-shadow: 0 10px 28px rgba(80, 30, 55, .18);
    }
    #videoWrap .caption { margin: 12px 0 0; font-weight: 700; color: #d94f91; }
  </style>
</head>
<body>
  <main class="card">
    <div class="hearts">♡ ♡ ♡</div>
    <h1>작은 선물이 도착했어요!</h1>
    <p>제이든이 준비한 달콤한 선물을 확인해 보세요 💌</p>
    <div class="gift" aria-hidden="true">🍭</div>
    <button id="giftButton" type="button">제이든에게 츄팝츄스 받기 💗</button>
    <div class="hint">버튼을 누르면 선물이 공개됩니다 ✨</div>
    <section id="videoWrap">
      <video id="giftVideo" controls loop playsinline preload="metadata">
        <source src="https://github.com/Jayden19726/-2-/releases/download/V1.0/MC.-.MV.ziyiu6t78AQ.mp4" type="video/mp4">
        브라우저가 동영상을 재생할 수 없습니다.
      </video>
      <p class="caption">제이든의 특별 선물 💕</p>
    </section>
  </main>
  <script>
    const button = document.getElementById('giftButton');
    const videoWrap = document.getElementById('videoWrap');
    const video = document.getElementById('giftVideo');

    button.addEventListener('click', async () => {
      videoWrap.style.display = 'block';
      button.textContent = '선물 공개 완료 💝';
      button.disabled = true;
      button.style.opacity = '0.75';
      video.volume = 1;
      try {
        await video.play();
      } catch (error) {
        // 일부 모바일 브라우저에서는 화면에 표시된 재생 버튼을 한 번 더 눌러야 할 수 있습니다.
      }
      videoWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
  </script>
</body>
</html>
